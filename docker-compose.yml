services:
  postgres:
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    build:
      context: ./infra/redis
      dockerfile: Dockerfile
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  nats:
    build:
      context: ./infra/nats
      dockerfile: Dockerfile
    command: ["-js", "-m", "8222", "-sd", "/data/jetstream"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - redis
      - nats
    environment:
      APP_MODE: ${APP_MODE}
      APP_HOST: ${APP_HOST}
      APP_PORT: ${APP_PORT}
      APP_SECRET: ${APP_SECRET}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      NATS_URL: ${NATS_URL}
      NATS_STREAM: ${NATS_STREAM}
      NATS_SUBJECT: ${NATS_SUBJECT}
    expose:
      - "8081"
    labels:
      tlfpaas.route: "backend"
    healthcheck:
      test: ["CMD", "/app/messenger-backend", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    expose:
      - "8080"
    labels:
      tlfpaas.route: "frontend"
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  nats_data:
